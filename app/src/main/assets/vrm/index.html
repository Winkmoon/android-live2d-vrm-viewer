<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Moon 3D Avatar</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }
    #app {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(126, 108, 255, 0.22), transparent 42%),
        radial-gradient(circle at 80% 80%, rgba(255, 110, 190, 0.12), transparent 38%),
        linear-gradient(160deg, #0d1017 0%, #1a202c 52%, #080a0f 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(8, 10, 15, 0.58);
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #b7a8ff;
      animation: spin 0.9s linear infinite;
    }
    #status {
      max-width: 80vw;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      padding: 0 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">
    <div class="spinner"></div>
    <div id="status">正在准备 3D 查看器…</div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
